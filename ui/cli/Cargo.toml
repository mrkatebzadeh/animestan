[package]
name = "animestan-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
animestan-core = { path = "../../core" }
clap = { version = "4.5", features = ["derive"] }
spdlog = { version = "0.5", package = "spdlog-rs" }
serde_json = "1.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
