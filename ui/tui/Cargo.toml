[package]
name = "animestan-tui"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"

[dependencies]
animestan-core = { path = "../../core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.28"
spdlog = { version = "0.5", package = "spdlog-rs" }
serde_json = "1.0"
nucleo = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
