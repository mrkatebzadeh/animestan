[package]
name = "animestan-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
animestan-core = { path = "../../core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.28"
spdlog = { version = "0.5", package = "spdlog-rs" }
serde_json = "1.0"
nucleo = "0.5"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
