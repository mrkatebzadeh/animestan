[package]
name = "animestan"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "TUI anime discovery, tracking, and playback tool."
license = "GPL-3.0-only"
repository = "https://github.com/mrkatebzadeh/animestan"
homepage = "https://github.com/mrkatebzadeh/animestan"
readme = "README.md"
keywords = ["anime", "terminal", "tui", "ratatui", "playback", "tracking"]
categories = ["command-line-utilities", "console", "terminal-user-interface"]

[dependencies]
animestan-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29.0", features = ["all-widgets"] }
toml = "0.8"
spdlog = { version = "0.5", package = "spdlog-rs" }
serde_json = "1.0"
nucleo = "0.5"
tokio = { version = "1.44.1", features = ["full"] }
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm", "image-defaults"] }
throbber-widgets-tui = "0.8.0"
image = "0.25.4"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
