[package]
name = "animestan-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
directories-next = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spdlog = { version = "0.5", package = "spdlog-rs" }
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
